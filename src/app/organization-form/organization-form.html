<div class="fb-page">

  <!-- ══════════ NAVBAR ══════════ -->
  <header class="fb-navbar">
    <div class="fb-navbar__brand">
      <div class="fb-brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </div>
      <div class="fb-navbar__title-group">
        <span class="fb-navbar__title">Form Builder</span>
        <span class="fb-navbar__sub">OrgVault</span>
      </div>
    </div>

    <div class="fb-navbar__center">
      <div class="fb-steps">
        <div class="fb-step fb-step--done">
          <div class="fb-step__dot">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span>Design</span>
        </div>
        <div class="fb-step-line fb-step-line--done"></div>
        <div class="fb-step fb-step--active">
          <div class="fb-step__dot">2</div>
          <span>Build</span>
        </div>
        <div class="fb-step-line"></div>
        <div class="fb-step">
          <div class="fb-step__dot">3</div>
          <span>Publish</span>
        </div>
      </div>
    </div>

    <div class="fb-navbar__actions">
      <button class="fb-btn fb-btn--ghost" (click)="back()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        Back
      </button>
      <button class="fb-btn fb-btn--success">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Form
      </button>
      <button class="fb-btn fb-btn--preview">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
    </div>
  </header>

  <!-- ══════════ BODY ══════════ -->
  <div class="fb-body">

    <!-- ── Sidebar ── -->
    <aside class="fb-sidebar">
      <div class="fb-sidebar__header">
        <div class="fb-sidebar__title-row">
          <span class="fb-sidebar__title">Components</span>
          <span class="fb-sidebar__count-badge">
            {{ getFilteredCategories().length }} cats
          </span>
        </div>
        <div class="fb-search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            type="text"
            placeholder="Search components…"
            [value]="searchQuery()"
            (input)="searchQuery.set($any($event).target.value)"
          />
        </div>
      </div>

      <div class="fb-categories">
        <div
          *ngFor="let category of getFilteredCategories()"
          class="fb-category"
          [class]="'fb-category fb-category--' + category.name.toLowerCase()"
        >
          <button
            class="fb-cat-hdr"
            [class.expanded]="category.expanded"
            (click)="toggleCategory(category.name)"
          >
            <span class="fb-cat-icon">{{ category.icon }}</span>
            <span class="fb-cat-name">{{ category.name }}</span>
            <span class="fb-cat-badge">{{ category.components.length }}</span>
            <span class="fb-cat-toggle">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </span>
          </button>

          <div *ngIf="category.expanded" class="fb-comps">
            <button
              *ngFor="let component of category.components"
              class="fb-comp-item"
              draggable="true"
              (click)="addComponent(component)"
              (dragstart)="onComponentDragStart($event, component)"
              (dragend)="onComponentDragEnd($event)"
            >
              <span class="fb-comp-icon">{{ component.icon }}</span>
              <span class="fb-comp-label">{{ component.label }}</span>
              <span class="fb-comp-drag">⋮⋮</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Sidebar footer -->
      <div class="fb-sidebar__footer">
        <div class="fb-sidebar__tip">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Click or drag to add fields
        </div>
      </div>
    </aside>

    <!-- ── Canvas ── -->
    <div class="fb-canvas-wrap">

      <!-- Canvas topbar -->
      <div class="fb-canvas-topbar">
        <div>
          <h2 class="fb-canvas-topbar__title">Form Canvas</h2>
          <p class="fb-canvas-topbar__sub">Drag &amp; drop components or click to add them</p>
        </div>
        <div class="fb-canvas-topbar__badges">
          <span class="fb-badge fb-badge--purple">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="8 6 2 12 8 18"/><polyline points="16 6 22 12 16 18"/></svg>
            Form.io Powered
          </span>
          <span class="fb-badge fb-badge--teal">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Live Preview
          </span>
        </div>
      </div>

      <!-- Canvas inner -->
      <div class="fb-canvas-inner">
        <!-- Loading -->
        <div *ngIf="loading" class="fb-loading">
          <div class="fb-loading__ring">
            <div></div><div></div><div></div><div></div>
          </div>
          <span class="fb-loading__text">Initializing Form Builder…</span>
          <span class="fb-loading__sub">Setting up drag &amp; drop engine</span>
        </div>

        <!-- Error -->
        <div *ngIf="error" class="fb-error">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ error }}
        </div>

        <div id="formBuilder" class="fb-canvas"></div>
      </div>
    </div>
  </div>
</div>
